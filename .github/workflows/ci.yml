name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Check all targets
        run: cargo check --all-targets
      - name: Test diagnostic redaction
        run: ./scripts/test-diagnose-redaction.sh

  rust-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check macOS targets
        run: cargo check --all-targets

  macos-settings-gui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Select Swift 6.2 toolchain
        run: |
          if [[ -d /Applications/Xcode_26.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [[ -d /Applications/Xcode_26.3.0.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            echo "Xcode 26.3 is required by PermissionFlow" >&2
            exit 1
          fi
          swift --version
      - name: Build shared config helper
        run: cargo build --release --bin companion-config
      - name: Build SwiftUI settings package
        working-directory: macos/TrackpadCompanionSettings
        env:
          COMPANION_CONFIG_BIN: ${{ github.workspace }}/target/release/companion-config
        run: swift build -c release

  macos-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Select Swift 6.2 toolchain
        run: |
          if [[ -d /Applications/Xcode_26.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [[ -d /Applications/Xcode_26.3.0.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            echo "Xcode 26.3 is required by PermissionFlow" >&2
            exit 1
          fi
          swift --version
      - name: Build ad-hoc development app bundle
        run: |
          ./packaging/macos/test-package-dmg.sh
          ./packaging/macos/test-service-lifecycle.sh
          ./packaging/macos/build-app.sh
          ./packaging/macos/package-dmg.sh
      - name: Verify bundle contents
        run: |
          test -x "dist/macos/Trackpad Companion.app/Contents/MacOS/TrackpadCompanion"
          test -x "dist/macos/Trackpad Companion.app/Contents/Resources/companion-net"
          test -x "dist/macos/Trackpad Companion.app/Contents/Resources/companion-config"
          test -d "dist/macos/Trackpad Companion.app/Contents/Resources/PermissionFlow_PermissionFlow.bundle"
          unzip -t dist/macos/*-macos.zip
          test -s dist/macos/*-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: trackpad-companion-macos-development
          path: dist/macos/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Android tests and assemble debug APK
        working-directory: android
        run: ./gradlew test assembleDebug
