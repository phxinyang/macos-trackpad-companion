name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Test workspace
        run: cargo test --workspace
      - name: Check all targets
        run: cargo check --all-targets

  rust-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check macOS targets
        run: cargo check --all-targets

  macos-settings-gui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build shared config helper
        run: cargo build --release --bin companion-config
      - name: Build SwiftUI settings package
        working-directory: macos/TrackpadCompanionSettings
        env:
          COMPANION_CONFIG_BIN: ${{ github.workspace }}/target/release/companion-config
        run: swift build -c release

  macos-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build unsigned app bundle
        run: ./packaging/macos/build-app.sh
      - name: Verify bundle contents
        run: |
          test -x "dist/macos/Trackpad Companion.app/Contents/MacOS/TrackpadCompanion"
          test -x "dist/macos/Trackpad Companion.app/Contents/Resources/companion-net"
          test -x "dist/macos/Trackpad Companion.app/Contents/Resources/companion-config"
          unzip -t dist/macos/*-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: trackpad-companion-macos-unsigned
          path: dist/macos/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Android tests and assemble debug APK
        working-directory: android
        run: ./gradlew test assembleDebug
