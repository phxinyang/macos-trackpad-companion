name: macOS release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Select Swift 6.2 toolchain
        run: |
          if [[ -d /Applications/Xcode_26.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [[ -d /Applications/Xcode_26.3.0.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            echo "Xcode 26.3 is required by PermissionFlow" >&2
            exit 1
          fi
          swift --version
      - name: Build and package DMG
        run: |
          ./packaging/macos/build-app.sh
          ./packaging/macos/package-dmg.sh
          shasum -a 256 dist/macos/*.dmg dist/macos/*.zip
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trackpad-companion-macos
          path: dist/macos/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/macos/*.dmg
            dist/macos/*.zip
