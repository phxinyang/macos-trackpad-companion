    ctx.strokeStyle = hexAlpha("#FFFFFF", 0x55 * alpha);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(t.x, t.y, halo * .72, 0, Math.PI * 2); ctx.stroke();

    const streak = 18 + Math.min(speed * .12, 26);
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(angle);
    const sheen = ctx.createLinearGradient(-streak / 2, 0, streak / 2, 0);
    sheen.addColorStop(0, "rgba(255,255,255,0)");
    sheen.addColorStop(.5, hexAlpha("#FFFFFF", 0x7A * alpha));
    sheen.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sheen;
    // Use a plain rect for Safari versions that predate Canvas roundRect.
    ctx.fillRect(-streak / 2, -1.5, streak, 3);
    ctx.restore();

    const core = 5.5 + Math.min(speed * .018, 2.5);
    ctx.fillStyle = hexAlpha(color, 0xD8 * alpha);
    ctx.beginPath(); ctx.arc(t.x, t.y, core, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexAlpha("#FFFFFF", 0xDC * alpha);
    ctx.beginPath(); ctx.arc(t.x - core * .3, t.y - core * .3, core * .34, 0, Math.PI * 2); ctx.fill();
  }

  function hexAlpha(hex, alpha) {
    const value = Math.max(0, Math.min(255, Math.round(alpha)));
    return `${hex}${value.toString(16).padStart(2, "0")}`;
  }

  // ---- Wire Protocol (docs/wire-protocol.md) --------------------------
  let seq = (crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0;
  const MAGIC = [0x41, 0x54, 0x50, 0x31];           // "ATP1"
  const TIP = 1, CONF = 2;

  function encodeFrame(contacts, button = false) {   // [{id,x,y}] mm
    const n = contacts.length;
    const buf = new ArrayBuffer(15 + 10 * n);
    const v = new DataView(buf);
    MAGIC.forEach((b, i) => v.setUint8(i, b));
    v.setUint8(4, 1);                                // version
    v.setUint8(5, button ? 1 : 0);                   // flags: integrated button
    v.setUint8(6, n);
    seq = (seq + 1) >>> 0;                           v.setUint32(7, seq, true);
    const ticks = (performance.now() * 10) >>> 0;    // 100 µs ticks
    v.setUint32(11, ticks, true);
    contacts.forEach((c, i) => {
      const o = 15 + 10 * i;
      v.setUint8(o, c.id & 0xff);
      v.setUint8(o + 1, TIP | CONF);
      v.setFloat32(o + 2, c.x, true);
      v.setFloat32(o + 6, c.y, true);
    });
    return buf;
  }

  // ---- WebSocket ------------------------------------------------------
  let ws = null, wsTimer = 0, backoff = 1000, connectionGeneration = 0;
  let lastConnectionState = "wait";
  function setStatus(state) {
    lastConnectionState = state;
    dot.className = state === "on" ? "on" : state === "off" ? "off" : "";
    st.textContent = state === "on" ? t("connected") : state === "off" ? t("disconnected") : t("connecting");
    padStatusBtn.textContent = state === "on" ? t("connected") : state === "off" ? t("retry_connect") : t("connecting");
    padStatusBtn.setAttribute("aria-label", state === "off" ? t("retry_connect") : t("conn_status"));
    padStatusBtn.dataset.state = state;
    connectionBtn.setAttribute("aria-label", state === "wait" ? t("cancel_connect") : state === "off" ? t("click_to_reconnect") : t("conn_status"));
    connectionBtn.title = state === "wait" ? t("click_to_cancel") : state === "off" ? t("click_to_reconnect") : t("conn_status");
    connectionBtn.dataset.state = state;
    setChromeCollapsed(state === "on");
  }
  function setChromeCollapsed(collapsed) {
    const compact = collapsed;
    bar.dataset.collapsed = String(compact);
    document.documentElement.dataset.chrome = compact ? "compact" : "expanded";
  }
  function connect() {
    const generation = ++connectionGeneration;
    clearTimeout(wsTimer); wsTimer = 0;
    if (ws) {
      const previous = ws;
      ws = null;
      previous.onopen = previous.onclose = previous.onerror = null;
      try { previous.close(); } catch (_) {}
    }
    setStatus("wait");
    // When the server has [net].token enabled, pass the bearer token from
    // the page URL through to the WebSocket handshake. Keeping it in the
    // query is the only browser-native way to authenticate a WebSocket
    // constructor; native clients may use Authorization instead.
    const token = new URLSearchParams(location.search).get("token");
    const authQuery = token ? `?token=${encodeURIComponent(token)}` : "";
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws" + authQuery;
    let socket;
    try { socket = new WebSocket(url); } catch (e) { scheduleRetry(generation); return; }
    ws = socket;
    socket.binaryType = "arraybuffer";
    socket.onopen = () => {
      if (generation !== connectionGeneration) { try { socket.close(); } catch (_) {} ; return; }
      setStatus("on"); backoff = 1000;
    };
    socket.onclose = () => {
      if (generation !== connectionGeneration) return;
      if (ws === socket) ws = null;
      setStatus("off"); scheduleRetry(generation);
    };
    socket.onerror = () => { try { socket.close(); } catch (_) {} };
  }
  function scheduleRetry(generation) {
    if (generation !== connectionGeneration) return;
    clearTimeout(wsTimer);
    wsTimer = setTimeout(() => {
      wsTimer = 0;
      if (generation === connectionGeneration) connect();
    }, backoff);
    backoff = Math.min(5000, backoff * 1.5);
  }
  function cancelConnection() {
    connectionGeneration += 1;
    clearTimeout(wsTimer); wsTimer = 0;
    if (ws) {
      const socket = ws;
      ws = null;
      socket.onopen = socket.onclose = socket.onerror = null;
      try { socket.close(); } catch (_) {}
    }
    backoff = 1000;
    setStatus("off");
  }
  function sendRaw(data) { if (ws && ws.readyState === 1) { try { ws.send(data); } catch (_) {} } }

  applyLanguage(currentLang);
  if (langBtn) {
    langBtn.onclick = () => {
      applyLanguage(currentLang === "zh" ? "en" : "zh");
    };
  }

  connect();
  hostHint.textContent = location.host;
  padStatusBtn.onclick = () => {
    if (padStatusBtn.dataset.state === "wait") cancelConnection();
    else if (padStatusBtn.dataset.state === "off") connect();
  };
  connectionBtn.onclick = () => {
    if (connectionBtn.dataset.state === "wait") cancelConnection();
    else if (connectionBtn.dataset.state === "off") connect();
  };
  setInterval(() => sendRaw("p"), 15000);            // keepalive text ping

  // ---- Touch Capture --------------------------------------------------
  const pointers = new Map();                        // pointerId -> cid
  let nextCid = 1;
  const freeIds = [];
  const pos = new Map();                             // pointerId -> {x,y} mm
  let touchStartTime = 0, initialPos = { x: 0, y: 0 }, maxFingers = 0;

  function toMm(ev) {
    const rect = pad.getBoundingClientRect();
    const mmPerCssPx = VIRTUAL_SURFACE_WIDTH_MM / Math.max(1, rect.width);
    return {
      x: (ev.clientX - rect.left) * mmPerCssPx * scale,
      y: (ev.clientY - rect.top) * mmPerCssPx * scale,
    };
  }

  let dirty = false, rafId = 0, visualRafId = 0, lastVisualPaint = 0;
  function snapshot() {
    const out = [];
    for (const [pid, cid] of pointers) {
      const p = pos.get(pid);
      if (p) out.push({ id: cid, x: p.x, y: p.y });
    }
    return out;
  }
  function loop() {
    rafId = 0;
    if (pointers.size > 0 || deepPressed) {
      // Keep reporting every frame while contacts are down, moving or
      // not. A browser stops delivering pointermove for a finger that
      // is held still, and from the receiver's side a stream that goes
      // quiet is indistinguishable from a client that went away — it
      // used to resolve that by ending the touch, which turned a held
      // finger into a phantom tap. A real trackpad reports at a fixed
      // rate regardless of motion; so does this now.
      dirty = false;
      sendRaw(encodeFrame(snapshot(), deepPressed));
      rafId = requestAnimationFrame(loop);
    } else if (dirty) {
      dirty = false;
      echoLift();
    }
  }
  function visualLoop(timestamp) {
    visualRafId = 0;
    if (!touchPointsVisible) return;
    if (timestamp - lastVisualPaint < 1000 / 30) {
      visualRafId = requestAnimationFrame(visualLoop);
      return;
    }
    lastVisualPaint = timestamp;
    drawVisualizer();
    if (pointers.size > 0 || releasedVisualTouches.length) {
      visualRafId = requestAnimationFrame(visualLoop);
    }
  }
  function kickVisual() {
    if (!visualRafId && touchPointsVisible) visualRafId = requestAnimationFrame(visualLoop);
  }
  function kick() {
    dirty = true;
    if (!rafId) rafId = requestAnimationFrame(loop);
    kickVisual();
  }

  let liftTimers = [];
  function echoLift() {
    liftTimers.forEach(clearTimeout); liftTimers = [];
    sendRaw(encodeFrame([]));
    liftTimers.push(setTimeout(() => sendRaw(encodeFrame([])), 30));
    liftTimers.push(setTimeout(() => sendRaw(encodeFrame([])), 90));
  }

  const pad = $("pad-container");
  function acquireCid() { return freeIds.length ? freeIds.pop() : (nextCid++ % 256); }
  function releaseCid(cid) { freeIds.push(cid); }

  pad.addEventListener("pointerdown", e => {
    e.preventDefault(); wake();
    try { pad.setPointerCapture(e.pointerId); } catch (_) {}
    padFrame.dataset.active = "true";
    if (pointers.size === 0) {
      touchStartTime = performance.now();
      maxFingers = 1;
      initialPos = { x: e.clientX, y: e.clientY };
      frameRect = padFrame.getBoundingClientRect();
    }
    if (pointers.has(e.pointerId)) return;
    const cid = acquireCid();
    pointers.set(e.pointerId, cid);
    pos.set(e.pointerId, toMm(e));
    visualTouches.set(e.pointerId, { pointerId: e.pointerId, x: e.clientX, y: e.clientY, cid, vx: 0, vy: 0, lastTime: e.timeStamp, trail: [] });
    if (padLens) padLens.style.transform = `translate3d(${e.clientX - frameRect.left}px, ${e.clientY - frameRect.top}px, 0)`;
    if (pointers.size > maxFingers) maxFingers = pointers.size;

    sendRaw(encodeFrame(snapshot(), deepPressed));
    kick();
  }, { passive: false });

  pad.addEventListener("pointermove", e => {
    e.preventDefault();
    if (!pointers.has(e.pointerId)) return;
    pos.set(e.pointerId, toMm(e));
    const visual = visualTouches.get(e.pointerId);
    if (visual) {
      const dt = Math.max(1, Math.min(64, e.timeStamp - visual.lastTime));
      visual.trail.push({ x: visual.x, y: visual.y });
      if (visual.trail.length > 8) visual.trail.shift();
      visual.vx = visual.vx * .60 + ((e.clientX - visual.x) / dt * 16) * .40;
      visual.vy = visual.vy * .60 + ((e.clientY - visual.y) / dt * 16) * .40;
      visual.x = e.clientX; visual.y = e.clientY; visual.lastTime = e.timeStamp;
    }
    if (padLens) padLens.style.transform = `translate3d(${e.clientX - frameRect.left}px, ${e.clientY - frameRect.top}px, 0)`;
    if (pointers.size > maxFingers) maxFingers = pointers.size;
    kick();
  }, { passive: false });

  function releasePointer(e) {
    if (!pointers.has(e.pointerId)) return;
    try { pad.releasePointerCapture(e.pointerId); } catch (_) {}
    releaseCid(pointers.get(e.pointerId));
    pointers.delete(e.pointerId);
    pos.delete(e.pointerId);
    const visual = visualTouches.get(e.pointerId);
    if (visual) {
      visual.releasedAt = performance.now();
      releasedVisualTouches.push(visual);
      visualTouches.delete(e.pointerId);
    }
    if (pointers.size === 0) padFrame.dataset.active = "false";
    kick();
  }

  pad.addEventListener("pointerup", e => {
    e.preventDefault();
    const dur = performance.now() - touchStartTime;
    const dx = Math.abs(e.clientX - initialPos.x);
    const dy = Math.abs(e.clientY - initialPos.y);
    if (dur < 280 && dx < 15 && dy < 15) {
      if (maxFingers === 2) vibrate([30]);
      else if (maxFingers === 1) vibrate(12);
    }
    releasePointer(e);
  }, { passive: false });

  pad.addEventListener("pointercancel", e => releasePointer(e));

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) return;
    const hadPointers = pointers.size > 0;
    for (const pid of pointers.keys()) {
      try { pad.releasePointerCapture(pid); } catch (_) {}
    }
    for (const cid of pointers.values()) releaseCid(cid);
    pointers.clear(); pos.clear(); visualTouches.clear(); releasedVisualTouches.length = 0;
    padFrame.dataset.active = "false";
    cancelDeepPress();
    if (hadPointers) echoLift();
    cancelAnimationFrame(rafId); rafId = 0;
    cancelAnimationFrame(visualRafId); visualRafId = 0;
    drawVisualizer();
  });

  ["contextmenu", "dblclick", "gesturestart"].forEach(t =>
    document.addEventListener(t, e => e.preventDefault()));

  let wakeLock = null;
  async function wake() {
    try {
      if (!wakeLock || wakeLock.released) wakeLock = await navigator.wakeLock.request("screen");
    } catch (_) {}
  }
  wake();
})();
</script>
</body>
</html>
