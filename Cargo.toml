[workspace]
members = ["crates/touchpad-proto"]

[package]
name = "macos-trackpad-companion"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "companion"

[[bin]]
name = "companion"
path = "src/main.rs"

[[bin]]
name = "companion-net"
path = "src/bin/companion_net.rs"

[[bin]]
name = "gesture-tap"
path = "src/bin/gesture_tap.rs"

[[bin]]
name = "companion-tui"
path = "src/bin/companion_tui.rs"

[[bin]]
name = "companion-config"
path = "src/bin/companion_config.rs"

[dependencies]
touchpad-proto       = { path = "crates/touchpad-proto" }
sha1                 = "0.10"
libc                = "0.2"
log                 = "0.4"
env_logger          = "0.11"
anyhow              = "1"
clap                = { version = "4", features = ["derive"] }
serde               = { version = "1", features = ["derive"] }
serde_json           = "1"
toml                = "0.8"
crossterm           = "0.28"
ratatui             = "0.29"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation     = "0.10"
core-foundation-sys = "0.8"
core-graphics       = "0.25"
io-kit-sys          = "0.5"
objc2               = "0.6.4"
objc2-app-kit       = "0.3.2"
objc2-foundation    = "0.3.2"

[profile.release]
lto = "fat"
opt-level = 3
debug = 1
